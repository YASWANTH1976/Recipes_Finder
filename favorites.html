<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorite Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
        Favorite Recipes
      </h1>
      {% if favorites %}
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        {% for favorite in favorites %}
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
          <img
            src="{{ favorite[2] }}"
            alt="{{ favorite[1] }}"
            class="w-full h-48 object-cover"
          />
          <div class="p-4">
            <h3 class="text-xl font-semibold text-gray-800">
              {{ favorite[1] }}
            </h3>
            <a
              href="{{ url_for('recipe_details', recipe_id=favorite[0]) }}"
              class="mt-4 block bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 text-center"
              >View Details</a
            >
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-center text-gray-700">No favorite recipes yet.</p>
      {% endif %}
      <a
        href="{{ url_for('index') }}"
        class="block text-center mt-6 text-blue-500 hover:underline"
        >Back to Search</a
      >
    </div>
  </body>
</html>
